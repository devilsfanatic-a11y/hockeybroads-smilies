
name: Extract HockeyBroads Smilies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract images
        run: |
          mkdir -p smilies
          unzip -o "Proton Drive Download - 2026-10-30.zip" -d smilies

      - name: Save extracted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smilies
          git diff --cached --quiet || git commit -m "Add original HockeyBroads smileys"
          git push
