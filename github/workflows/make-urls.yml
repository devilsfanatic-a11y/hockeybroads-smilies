
name: Make Smiley URL List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote

          base = "https://raw.githubusercontent.com/devilsfanatic-a11y/hockeybroads-smilies/main/smilies/"
          images = sorted(
              (p for p in Path("smilies").iterdir()
               if p.suffix.lower() in (".gif", ".png", ".jpg", ".jpeg")),
              key=lambda p: p.name.lower()
          )
          Path("smiley-urls.txt").write_text(
              "\n".join(base + quote(p.name) for p in images) + "\n"
          )
          print(f"Generated {len(images)} URLs")
          PY

      - name: Save URL list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smiley-urls.txt
          git diff --cached --quiet || git commit -m "Generate smiley URL list"
          git push
